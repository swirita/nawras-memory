<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <meta name="description" content="Nawras Memory — find six pairs in 60 seconds in a playful matching game from NawrasEdu." />
    <title>Nawras Memory | NawrasEdu</title>
  </head>
  <body>
    <main>
      <div class="landing-decoration" aria-hidden="true">
        <svg class="landing-particles" xmlns="http://www.w3.org/2000/svg" focusable="false"></svg>
      </div>
      <section class="landing" aria-labelledby="landing-title">
        <div class="brand" id="landing-brand"></div>
        <div class="landing-copy">
          <h1 id="landing-title"><span>Nawras</span> <span class="memory-title">Memory</span></h1>
        </div>
        <div class="player-entry">
          <label for="player-name">Enter your name</label>
          <input id="player-name" name="playerName" type="text" autocomplete="given-name" maxlength="40" required aria-describedby="player-name-hint player-name-error" />
          <span id="player-name-hint" class="sr-only">Enter a name for your results and this browser’s leaderboard. Find six pairs in 60 seconds.</span>
          <span id="player-name-error" class="name-error" role="status" hidden>Enter your name to start.</span>
          <button class="start-button" type="button">Start</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
